<div class="login-container">
  <div class="login-card">
    <h2 class="title">Welcome to SuKart</h2>
    <p class="subtitle">Sign in to start shopping</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <input type="text" formControlName="username" placeholder="Username" />
      </div>

      <div class="form-group">
        <input
          type="password"
          formControlName="password"
          placeholder="Password"
        />
      </div>

      <button type="submit" class="btn-login" [disabled]="loginForm.invalid">
        Login
      </button>

      <div class="login-actions">
        <span>Don't have an account?</span>
        <button type="button" class="btn-register" routerLink="/auth/register">
          Register
        </button>
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </div>
</div>
